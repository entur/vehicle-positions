
server.port=8080

entur.vehicle-positions.gcp.topic.project.name=ent-anshar-dev
entur.vehicle-positions.gcp.topic.name.vm=avro.vehicle_monitoring
entur.vehicle-positions.gcp.topic.name.et=avro.estimated_timetables
entur.vehicle-positions.gcp.topic.name.sx=avro.situation_exchange
entur.vehicle-positions.gcp.subscription.project.name=ent-vpos-dev
entur.vehicle-positions.gcp.subscription.name.vm=vehicle-positions.graphql-${random.uuid}
entur.vehicle-positions.gcp.subscription.name.et=vehicle-positions.graphql-${random.uuid}
entur.vehicle-positions.gcp.subscription.name.sx=vehicle-positions.graphql-${random.uuid}
entur.vehicle-positions.gcp.labels={app:'vehicle-positions',team:'ror', slack:'talk-ror', manager:'application'}

# https://cloud.google.com/pubsub/docs/concurrency-control#java
# how many StreamingPull streams the subscriber will open to receive message.
entur.vehicle-positions.pubsub.parallel.pullcount=1
# Number of executor-threads per stream
entur.vehicle-positions.pubsub.parallel.executorThreadCount=5

management.endpoints.web.exposure.include=info, health, prometheus, env, metrics, loggers
management.endpoint.prometheus.enabled=true

management.metrics.endpoint.export.prometheus.enabled=true

vehicle.updates.max.validity.minutes=1440

vehicle.updates.purge.interval=PT5S
vehicle.updates.expiry.grace.period=PT10M

timetable.updates.purge.interval=PT1M
timetable.updates.expiry.grace.period=PT10M

situation.updates.purge.interval=PT1M
situation.updates.expiry.grace.period=PT10M

spring.graphql.websocket.path=/subscriptions
spring.graphql.graphiql.enabled=true
# Spring GraphQL 2.0 (Boot 4.1) enforces a CORS/Origin check on the WebSocket
# handshake; without this, browser subscriptions from GraphiQL / the API gateway
# are rejected with 403 (the old stack allowed all origins). This is a public,
# credential-free API, so all origins are allowed - matching the previous behavior.
spring.graphql.cors.allowed-origins=*

entur.vehicle-positions.client.name.header.name=Et-Client-Name

vehicle.nsr.lookup.nsr=https://storage.googleapis.com/marduk-production/tiamat/CurrentAndFuture_latest.zip
vehicle.nsr.lookup.enabled=false

# Planned data (lines, operators, service journeys, dated service journeys, route geometry)
# is loaded from the aggregated NeTEx export at startup and reloaded nightly. Startup blocks
# until the first load completes. Disabled by default for local runs; enabled in helm.
vehicle.planned.data.enabled=false
vehicle.planned.data.url=https://storage.googleapis.com/marduk-production/outbound/netex/rb_norway-aggregated-netex.zip
# Marduk's export was observed landing at ~07:30 UTC; reloading earlier picks up yesterday's file.
vehicle.planned.data.reload.cron=0 0 8 * * *
# A fresh load with fewer service journeys than this is rejected outright, even on the first load.
vehicle.planned.data.min.service.journeys=50000

# How far an affected stop may sit from a journey's route geometry and still be considered on
# it, when cutting Situation.affects.vehicleJourneys[].affectedPointsOnLink. Sized for rail: a
# large stop place's centroid sits a few hundred metres from the track it is measured against.
vehicle.situations.affected-geometry.max-snap-meters=500

# Where per-export snapshots of the planned data and NSR datasets are cached so a starting
# pod can skip the NeTEx parses. gs://bucket/prefix, file:///dir, or empty to disable.
vehicle.snapshot.uri=

# The snapshot URL and the Pub/Sub topic project must move together per environment:
# pointing the snapshot at production while the stream reads ent-anshar-dev would merge
# two inconsistent datasets into one map.
vehicle.sx.snapshot.url=https://api.dev.entur.io/realtime/v1/rest/sx?SIRI_VERSION=2.1
vehicle.sx.snapshot.etClientName=ror.vehicle-positions.graphql
vehicle.sx.snapshot.timeout=PT60S

# Situation-triggered republishing of estimated timetables. A situation matching a large share
# of stored journeys is emitted in chunks rather than one burst: the ET sink is directBestEffort
# with onBackpressureDrop, so an unpaced burst is discarded for slower subscribers - and the sink
# cannot tell a republish from a genuine ET update.
vehicle.sx.republish.chunk.size=100
vehicle.sx.republish.chunk.delay=PT0.05S

# Logged once, as a WARN, when a single situation change matches at least this many candidate
# journeys - a major interchange, a stop place or a whole network can match a large fraction of
# the map. Emission is never capped or dropped on this - the WARN is only an operability signal.
vehicle.sx.republish.large.fanout.threshold=2000

# Coordinates reported by upstream producers for vehicles whose real position is unknown.
# Comma-separated latitude/longitude pairs, matched exactly. Vehicles at these coordinates are
# still stored and still queryable, but are only returned when a client passes
# includeInvalidLocations: true.
vehicle.invalid.locations=0.0/0.0,-1.0/-1.0,1.0/1.0