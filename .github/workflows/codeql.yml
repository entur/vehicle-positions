name: "CodeQL"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * MON"

jobs:
  code-scan:
    name: Code Scan
    uses: entur/gha-security/.github/workflows/code-scan.yml@0962fb4f3f9004eeaea88582db8639e140ec6fda # v2.17.1
    with:
      # superpom 7 enforces JDK >= 25; without this, CodeQL's autobuild uses the runner's JDK.
      use_setup_java: true
      java_version: "25"
      use_maven_cache: true
    secrets: inherit
