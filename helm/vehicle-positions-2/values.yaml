default_replicas: 4

resources:
  memLimit: 8G
  cpuRequest: '2'
  memRequest: 6G
  xmx: 5G
  # The NeTEx zip (280 MB) and the raw planned-data snapshot (about 250 MB) coexist briefly on disk.
  ephemeralRequest: 1Gi

rollingUpdate:
  maxSurge: 1
  maxUnavailable: 0

PodDisruptionBudget:
  minAvailable: 50%

configMap:
  graphiqlEnabled: false
  topicName:
    vm: siri.vehicle_monitoring
    et: siri.estimated_timetables
    sx: siri.situation_exchange
  parallel:
    streamcount: 1
    threadcount: 5
  plannedData:
    enabled: true
    url: https://storage.googleapis.com/marduk-production/outbound/netex/rb_norway-aggregated-netex.zip
    # Europe/Oslo. Marduk's export lands around 07:30 UTC; confirm before moving this earlier.
    reloadCron: "0 0 8 * * *"
    # A fresh load with fewer service journeys than this is rejected outright, even on the first load.
    minServiceJourneys: 50000
  # Per-export snapshots of the planned data and NSR datasets, so a starting pod skips the
  # NeTEx parses. gs://bucket/prefix per environment; empty disables snapshots entirely.
  snapshotUri: ""
  # Client-name header sent when fetching the SX situation snapshot at startup.
  sxSnapshotEtClientName: ror.vehicle-positions.graphql
  etEnabled: false
  vmEnabled: true
  # Deliberately off in every environment for now - turning the SX stream on in a real
  # environment is an operator decision, made per-environment below, not a default.
  sxEnabled: false

secretMount:
  name: vehicle-positions
  mountPath: /etc/vehicle-positions/credentials.json
  subPath: credentials.json
  secretName: ror-vehicle-positions-sa-key
  readOnly: true


configMapMount:
  name: vehicle-positions-2-config

image:
  identifier: <+artifacts.primary.image>
  imagePullPolicy: Always

service:
  http:
    externalPort: 80
    internalPort: 8080

hpa:
  maxReplicas: 20
  minReplicas: 2
  targetCPUUtilizationPercentage: 80
