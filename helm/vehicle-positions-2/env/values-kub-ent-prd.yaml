ingress:
  domainName: -gcp2.entur.io

configMap:
  subscriptionProjectId: ent-vpos-prd
  topicProjectId: ent-anshar-prd
  # Disabled in prd for now
  bearingCalculationEnabled: true
  etEnabled: true
  sxEnabled: true
  sxSnapshotUrl: https://api.entur.io/realtime/v1/rest/sx?SIRI_VERSION=2.1
  sxSnapshotEtClientName: ror.vehicle-positions.v2.graphql
  # Startup snapshot cache. Bucket from terraform/snapshots.tf; empty disables it.
  snapshotUri: gs://ent-gcs-vpos-snapshots-prd-001/snapshots

hpa:
  # WebSocket clients stay on the pod they connected to; with 2 pods they all share two, and on
  # 2026-11-23 the two busiest fell ~10 minutes behind on vehicle positions.
  minReplicas: 3


